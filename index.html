<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ジャンプゲーム</title>
    <style>
        body { margin: 0; padding: 0; background: #222; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: sans-serif; overflow: hidden; }
        canvas { background: #333; box-shadow: 0 4px 15px rgba(0,0,0,0.5); cursor: pointer; }
        .instructions { margin-top: 15px; font-size: 14px; color: #aaa; text-align: center; }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <div class="instructions">
        [Space] / 画面クリックでジャンプ・二段階ジャンプ / スタートします
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // --- ゲーム設定 ---
        const playerSettings = {
            x: 100,
            y: 250,
            width: 50,
            height: 50,
            gravity: 0.8,
            jumpPower: -13,
            doubleJumpPower: -11, // 二段階目のジャンプ力
        };

        const groundLevel = 300;
        const obstacleTypes = ['ground', 'ptera']; // 障害物の種類

        // --- ゲーム状態変数 ---
        const player = { ...playerSettings, vy: 0, jumpCount: 0 };
        let obstacles = [];
        let gameSpeed = 5;
        let score = 0;
        let isStarted = false;
        let isGameOver = false;
        let nextObstacleTimer = 0;

        // --- 画像読み込み ---
        const charImage = new Image();
        let imageLoaded = false;
        charImage.onload = () => { imageLoaded = true; };
        // 画像エラーフォールバック
        charImage.onerror = () => {
            if (charImage.src.endsWith('TTK_2.PNG')) charImage.src = 'TTK_2.png';
            else if (charImage.src.endsWith('TTK_2.png')) charImage.src = 'TTK_2.jpg';
        };
        charImage.src = 'TTK_2.PNG';

        // --- 入力処理 ---
        function triggerAction() {
            if (!isStarted) {
                isStarted = true;
                resetGame();
                return;
            }
            if (isGameOver) {
                resetGame();
                return;
            }

            // ジャンプ処理（二段階ジャンプ対応）
            if (player.jumpCount < 2) {
                if (player.jumpCount === 0) {
                    player.vy = player.jumpPower; // 一段階目
                } else {
                    player.vy = player.doubleJumpPower; // 二段階目
                }
                player.jumpCount++;
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                triggerAction();
            }
        });

        canvas.addEventListener('click', () => {
            triggerAction();
        });

        // --- ゲームロジック ---
        function resetGame() {
            obstacles = [];
            score = 0;
            gameSpeed = 5;
            isGameOver = false;
            isStarted = true;
            player.y = 250;
            player.vy = 0;
            player.jumpCount = 0;
            nextObstacleTimer = 60;
        }

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function createObstacle() {
            const type = obstacleTypes[getRandomInt(0, obstacleTypes.length - 1)];
            let newObstacle;

            if (type === 'ground') {
                // 地面障害物（飛ぶ・飛ばないのランダム性はここにはないが、プテラと混ぜる）
                newObstacle = {
                    type: 'ground',
                    x: canvas.width,
                    y: 270,
                    width: 30,
                    height: 30,
                    color: '#ff3333', // 赤い四角
                };
            } else if (type === 'ptera') {
                // 反対側（右側上空）から飛んでくるプテラノドン
                newObstacle = {
                    type: 'ptera',
                    x: canvas.width,
                    y: getRandomInt(100, 200), // 高さをランダムに
                    width: 60,
                    height: 40,
                    color: '#8e44ad', // 紫の四角（飛んでいる）
                    speedX: gameSpeed * 1.5, // プレイヤーに向かってくるので速め
                };
            }
            obstacles.push(newObstacle);
        }

        function update() {
            if (isStarted && !isGameOver) {
                score++;

                // プレイヤーの物理演算
                player.vy += player.gravity;
                player.y += player.vy;

                // 地面判定
                if (player.y >= groundLevel) {
                    player.y = groundLevel;
                    player.vy = 0;
                    player.jumpCount = 0; // 地面に着いたらジャンプ回数リセット
                }

                // 障害物の生成（ランダムな間隔）
                nextObstacleTimer--;
                if (nextObstacleTimer <= 0) {
                    createObstacle();
                    // 次の間隔をスコアに応じて調整
                    const minInterval = Math.max(30, 80 - Math.floor(score / 300));
                    const maxInterval = Math.max(70, 160 - Math.floor(score / 300));
                    nextObstacleTimer = getRandomInt(minInterval, maxInterval);
                }

                // 障害物の移動と判定
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    if (obstacles[i].type === 'ground') {
                        obstacles[i].x -= gameSpeed;
                    } else if (obstacles[i].type === 'ptera') {
                        obstacles[i].x -= obstacles[i].speedX; // プテラは独自の速度
                    }

                    // 衝突判定
                    if (
                        player.x < obstacles[i].x + obstacles[i].width &&
                        player.x + player.width > obstacles[i].x &&
                        player.y < obstacles[i].y + obstacles[i].height &&
                        player.y + player.height > obstacles[i].y
                    ) {
                        isGameOver = true;
                    }

                    // 画面外削除
                    if (obstacles[i].x + obstacles[i].width < 0) {
                        obstacles.splice(i, 1);
                    }
                }

                // スピードアップ
                gameSpeed = 5 + Math.floor(score / 500);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 地面
            ctx.fillStyle = '#555';
            ctx.fillRect(0, 330, canvas.width, 70);

            // プレイヤー（画像）
            if (imageLoaded) {
                ctx.drawImage(charImage, player.x, player.y, player.width, player.height);
            } else {
                ctx.fillStyle = '#ff80bf';
                ctx.fillRect(player.x, player.y, player.width, player.height);
            }

            // 障害物の描画（種類ごとに見た目を変える）
            for (let obs of obstacles) {
                ctx.fillStyle = obs.color;
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            }

            // スコア
            ctx.fillStyle = '#fff';
            ctx.font = '20px sans-serif';
            ctx.fillText(`SCORE: ${score}`, 20, 30);

            // スタート前
            if (!isStarted) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = '28px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('クリック または スペースキーでスタート', canvas.width / 2, canvas.height / 2);
                ctx.textAlign = 'left';
            }

            // ゲームオーバー
            if (isGameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = '30px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 15);
                ctx.font = '16px sans-serif';
                ctx.fillText('クリック または スペースキーでリトライ', canvas.width / 2, canvas.height / 2 + 25);
                ctx.textAlign = 'left';
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
